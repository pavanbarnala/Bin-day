<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117; --surface: #181c27; --border: #2a2f42;
    --text: #e8eaf0; --muted: #6b7280; --accent: #e2c97e;
  }

  body {
    background: var(--bg); color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column;
    position: relative; overflow: hidden;
  }

  body::before {
    content: ''; position: fixed; inset: 0;
    background-image: linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 40px 40px; opacity: 0.25; pointer-events: none;
  }

  /* ── TAB BAR ── */
  .tab-bar {
    display: flex; overflow-x: auto; scrollbar-width: none;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 0.5rem;
    flex-shrink: 0;
    position: relative; z-index: 10;
  }
  .tab-bar::-webkit-scrollbar { display: none; }

  .tab {
    flex-shrink: 0;
    padding: 0.85rem 1rem;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    transition: color 0.2s, border-color 0.2s;
    user-select: none;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* ── PAGES ── */
  .page { display: none; flex: 1; overflow-y: auto; padding: 1.5rem 1rem 2rem; align-items: center; flex-direction: column; }
  .page.active { display: flex; }

  /* ── CARD (shared) ── */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 2rem; width: 100%; max-width: 480px;
    position: relative; overflow: hidden; animation: fadeUp 0.35s ease both;
  }
  .card-top-bar {
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
    border-radius: 20px 20px 0 0; background: var(--accent); opacity: 0.5;
  }

  /* ── BIN DAY PAGE ── */
  .address { font-size: 0.62rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.4rem; }
  h1 { font-family: 'DM Serif Display', serif; font-size: 2.4rem; line-height: 1; margin-bottom: 0.2rem; }
  h1 em { font-style: italic; color: var(--accent); }
  .collection-date { font-size: 0.72rem; color: var(--muted); margin-bottom: 1.8rem; }
  .bin-list { display: flex; flex-direction: column; gap: 0.65rem; }
  .bin-item { display: flex; align-items: center; gap: 0.9rem; padding: 0.85rem 1rem; border-radius: 12px; border: 1px solid transparent; }
  .bin-item.rubbish   { background: rgba(74,85,104,0.15);  border-color: rgba(113,128,150,0.3); }
  .bin-item.recycling { background: rgba(26,107,74,0.15);  border-color: rgba(56,161,105,0.3); }
  .bin-item.food      { background: rgba(123,63,0,0.2);    border-color: rgba(217,119,6,0.3); }
  .bin-item.paper     { background: rgba(49,82,149,0.15);  border-color: rgba(99,132,199,0.3); }
  .bin-icon { font-size: 1.6rem; flex-shrink: 0; }
  .bin-info { flex: 1; }
  .bin-name { font-size: 0.88rem; font-weight: 500; color: var(--text); }
  .bin-desc { font-size: 0.67rem; color: var(--muted); margin-top: 0.15rem; }
  .bin-badge { font-size: 0.58rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 0.2rem 0.5rem; border-radius: 999px; }
  .bin-item.rubbish   .bin-badge { background: rgba(113,128,150,0.2); color: #718096; }
  .bin-item.recycling .bin-badge { background: rgba(56,161,105,0.2);  color: #38a169; }
  .bin-item.food      .bin-badge { background: rgba(217,119,6,0.2);   color: #d97706; }
  .bin-item.paper     .bin-badge { background: rgba(99,132,199,0.2);  color: #6384c7; }

  /* ── PLACEHOLDER PAGES ── */
  .placeholder {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center;
    padding: 3rem 1.5rem; gap: 0.75rem;
  }
  .placeholder-name {
    font-family: 'DM Serif Display', serif;
    font-size: 2.8rem; color: var(--text); line-height: 1;
  }
  .placeholder-name em { font-style: italic; color: var(--accent); }
  .placeholder-msg { font-size: 0.72rem; color: var(--muted); letter-spacing: 0.05em; }

  /* ── BIN DAY FOOTER ── */
  .bin-footer { margin-top: 1.5rem; font-size: 0.62rem; color: #3a3f52; text-align: center; letter-spacing: 0.06em; }
  .bin-footer a { color: #4a5168; text-decoration: none; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>

<script>
  // ── TAB SWITCHING ─────────────────────────────────────────────────────────
  function switchTab(id) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelector(`[onclick="switchTab('${id}')"]`).classList.add('active');
    document.getElementById('page-' + id).classList.add('active');
  }

  // ── BIN DAY LOGIC ─────────────────────────────────────────────────────────
  const WEEK_A_ANCHOR = new Date('2026-05-08T00:00:00');
  function isWeekA(d) {
    return Math.round((d - WEEK_A_ANCHOR) / (7*24*60*60*1000)) % 2 === 0;
  }
  function getBins(d) {
    if (isWeekA(d)) return [
      { type:'rubbish',   icon:'&#x1F5D1;&#xFE0F;', name:'General Rubbish', desc:'Black bin &mdash; household waste',      badge:'Fortnightly' },
      { type:'recycling', icon:'&#x267B;&#xFE0F;',  name:'Mixed Recycling', desc:'Blue bin &mdash; cans, plastic, glass', badge:'Fortnightly' },
      { type:'food',      icon:'&#x1F343;',          name:'Food Waste',      desc:'Caddy &mdash; all kitchen food scraps', badge:'Every week'  },
    ];
    return [
      { type:'paper', icon:'&#x1F4E6;', name:'Paper &amp; Card', desc:'Box &mdash; newspapers, cardboard, mail', badge:'Fortnightly' },
      { type:'food',  icon:'&#x1F343;', name:'Food Waste',       desc:'Caddy &mdash; all kitchen food scraps',   badge:'Every week'  },
    ];
  }
  function getThursday(today) {
    const d = new Date(today); d.setHours(0,0,0,0);
    const n = d.getDay(); d.setDate(d.getDate() + (n<=4 ? 4-n : 4+(7-n)));
    return d;
  }
  function renderBinDay() {
    const today = new Date(); today.setHours(0,0,0,0);
    const thu = getThursday(today);
    const dateStr = thu.toLocaleDateString('en-GB', {weekday:'long',day:'numeric',month:'long'});
    const el = document.getElementById('collectionDate');
    if (today.getDay()===4) {
      el.innerHTML = '<span style="color:var(--accent)">Today</span> &middot; ' + dateStr;
    } else {
      const diff = Math.round((thu-today)/(24*60*60*1000));
      el.textContent = dateStr + ' · ' + diff + ' day' + (diff!==1?'s':'') + ' away';
    }
    let html = '<div class="bin-list">';
    getBins(thu).forEach(b => {
      html += `<div class="bin-item ${b.type}"><span class="bin-icon">${b.icon}</span><div class="bin-info"><div class="bin-name">${b.name}</div><div class="bin-desc">${b.desc}</div></div><span class="bin-badge">${b.badge}</span></div>`;
    });
    html += '</div>';
    document.getElementById('binContent').innerHTML = html;
  }
  renderBinDay();
</script>
</body>
</html>
